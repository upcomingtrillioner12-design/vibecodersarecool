  <style id="one-loader">
    /* While booting: an opaque full-screen layer with ONE spinner. It sits above everything,
       so no other spinner (page, product page, content area) can show through. */
    html.booting::before {
      content: "" !important; display: block !important; position: fixed !important; inset: 0 !important;
      z-index: 2147483646 !important; background: #07080c !important; animation: none !important;
    }
    html.booting::after {
      content: "" !important; display: block !important; position: fixed !important; z-index: 2147483647 !important;
      top: 50% !important; left: 50% !important; width: 36px !important; height: 36px !important; margin: -18px 0 0 -18px !important;
      box-sizing: border-box; border: 3px solid rgba(255,255,255,.18) !important; border-top-color: #a29bfe !important;
      border-radius: 50% !important; background: none !important; animation: vhOneSpin .8s linear infinite !important;
    }
    html.booting body::before, html.booting body::after { content: none !important; display: none !important; }
    @keyframes vhOneSpin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Runs before first paint. It does two jobs:
    //  1) picks logged-in vs guest chrome from the local snapshot (no flicker on refresh)
    //  2) raises the "booting" mask so the page is never shown in a wrong auth state.
    //     app.js lowers the mask once it knows who the user is.
    (function () {
      var a = "guest", d = document.documentElement;
      try {
        var oauth = /[#?&](access_token|refresh_token|code|error)=/.test(location.hash + location.search);
        var k = Object.keys(localStorage).filter(function (x) { return /^sb-.*-auth-token$/.test(x); })[0];
        var s = k && JSON.parse(localStorage.getItem(k));
        if ((s && (s.user || s.refresh_token)) || localStorage.getItem("vh_user") || oauth) a = "user";
        if (oauth) d.classList.add("auth-returning");
      } catch (e) {}
      d.setAttribute("data-auth", a);
      d.classList.add("booting");
      // Safety net only: app.js removes the mask itself as soon as auth is settled.
      setTimeout(function () { d.classList.remove("booting"); }, 6500);
    })();
  </script>
