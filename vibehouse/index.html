<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="vibecodersarecool — Platform for vibe coders.">
  <title>vibecodersarecool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/premium.css">
  <script>
    // Single transparent boot mask – removed only by app.js after auth + data ready
    document.documentElement.classList.add("booting");
    document.documentElement.setAttribute("data-auth", "guest");
  </script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Expand sidebar" aria-expanded="false">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-header">
      <a href="/" class="sidebar-brand premium-brand">vibecodersarecool</a>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Home</span></a>
      <a href="/search" class="nav-item" data-page="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span class="nav-label">Search</span></a>
      <a href="/deals" class="nav-item" data-page="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span class="nav-label">Deals</span></a>
      <a href="/leaderboard" class="nav-item" data-page="leaderboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="nav-label">Leaderboard</span></a>
      <a href="/tasks" class="nav-item" data-page="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span class="nav-label">Tasks</span></a>
      <a href="/launch" class="nav-item" data-page="launch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg><span class="nav-label">Launch</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="userChip" style="display:none" onclick="App.go('/profile/me')">
        <div class="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name"></div>
          <div class="user-meta"></div>
        </div>
      </div>
      <div id="authButtons" style="display:flex;gap:8px;flex-direction:column">
        <button class="btn btn-ghost btn-sm" id="btnLogin" style="justify-content:center">Log in</button>
        <button class="btn btn-primary btn-sm" id="btnSignup" style="justify-content:center">Sign up</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
      </button>
      <div class="search-box">
        <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M12 12l-2.5-2.5"/></svg>
        <input type="text" id="globalSearch" placeholder="Search" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <div id="topGuest" class="top-guest">
          <button class="btn btn-ghost btn-sm" id="topLogin">Log in</button>
          <button class="btn btn-primary btn-sm" id="topSignup">Sign up</button>
        </div>
        <div class="top-user" id="topUser" style="display:none" title="Open profile">
          <div class="tu-av" id="tuAv"></div>
          <div class="tu-txt">
            <div class="tu-name" id="tuName"></div>
            <div class="tu-meta" id="tuMeta"></div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnLogout" style="display:none">Log out</button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/media.js"></script>
  <script src="js/launch.js"></script>
  <script src="js/vh-list.js"></script>
  <script>
    document.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        document.getElementById("globalSearch")?.focus();
      }
    });
  </script>
</body>
</html>
